[package]
name = "tokenpress-core"
description = "Language-agnostic core for TokenPress: formatter/tokenizer interfaces, options, results"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tiktoken-rs.workspace = true
# fancy-regex backend avoids the C onig build; training-only features unused.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
base64 = "0.22"
rustc-hash = "2"

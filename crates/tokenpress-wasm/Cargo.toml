[package]
name = "tokenpress-wasm"
description = "WebAssembly bindings for TokenPress: the Python, Rust, JavaScript/TypeScript, Go and Java formatters behind a thin wasm-bindgen boundary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib for the wasm artifact, rlib so host tests (and the coverage gate)
# can link the crate like any other library.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Path dependencies rather than the usual `workspace = true`: `default-features
# = false` is ignored on an inherited dependency unless the workspace entry
# spells it out, and every other crate wants the defaults. The HuggingFace
# tokenizer backend does not build for wasm32-unknown-unknown (its `getrandom`
# transitive needs a JS backend) and this crate does not expose tokenizer
# selection, so it is switched off here.
tokenpress-core = { path = "../tokenpress-core", default-features = false }
tokenpress-python = { path = "../tokenpress-python", default-features = false }
tokenpress-rust = { path = "../tokenpress-rust", default-features = false }
tokenpress-js = { path = "../tokenpress-js", default-features = false }
# Go's C grammar does build for wasm32-unknown-unknown, but only once the
# `tree-sitter-language` libc shim's headers are on the include path — upstream
# `tree-sitter-go`'s build script does not read the `DEP_TREE_SITTER_LANGUAGE_*`
# metadata that would put them there. site/build.sh exports the CFLAGS that do.
tokenpress-go = { path = "../tokenpress-go", default-features = false }
# Java's C grammar builds for wasm32-unknown-unknown under the very same
# export, with no build-script change of its own: the CFLAGS site/build.sh
# sets are a general facility for the shared tree-sitter engine's grammars,
# not a Go workaround. Measured — see the J6(b) entry in ROADMAP.md.
tokenpress-java = { path = "../tokenpress-java", default-features = false }
wasm-bindgen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

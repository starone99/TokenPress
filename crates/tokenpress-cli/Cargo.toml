[package]
name = "tokenpress-cli"
description = "The tokenpress binary: token-aware formatting for Python, Rust and (experimental) JavaScript/TypeScript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tokenpress"
path = "src/main.rs"

[lib]
name = "tokenpress_cli"
path = "src/cli.rs"

[dependencies]
tokenpress-core.workspace = true
tokenpress-python.workspace = true
tokenpress-rust.workspace = true
tokenpress-js.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
# Config file parsing only: the writer (`display`) half stays out of the build.
toml = { version = "1", default-features = false, features = [
    "parse",
    "serde",
    "std",
] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
similar = "2"

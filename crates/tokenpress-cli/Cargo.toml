[package]
name = "tokenpress-cli"
description = "The tokenpress binary: token-aware formatting for Python, Rust, JavaScript/TypeScript and Ruby"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tokenpress"
path = "src/main.rs"

[lib]
name = "tokenpress_cli"
path = "src/cli.rs"

[dependencies]
tokenpress-core.workspace = true
tokenpress-python.workspace = true
tokenpress-rust.workspace = true
tokenpress-js.workspace = true
# Always on in the default build: there is no cargo feature to opt out of the
# Ruby backend yet, so every `tokenpress` build needs libclang and a C compiler
# for `ruby-prism-sys` (see that crate's manifest). A default-on feature to
# switch it off is tracked as follow-up work.
tokenpress-ruby.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
# Config file parsing only: the writer (`display`) half stays out of the build.
toml = { version = "1", default-features = false, features = [
    "parse",
    "serde",
    "std",
] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
similar = "2"

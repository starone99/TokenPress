[package]
name = "tokenpress-cli"
description = "The tokenpress binary: token-aware formatting for Python, Rust, JavaScript/TypeScript and Ruby"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tokenpress"
path = "src/main.rs"

[lib]
name = "tokenpress_cli"
path = "src/cli.rs"

[features]
default = ["ruby"]
# The Ruby backend. On by default; switching it off drops `tokenpress-ruby`
# from the dependency graph entirely, and with it the libclang + C compiler
# build prerequisite that `ruby-prism-sys` (vendored prism C + bindgen)
# imposes. This is the crate's only feature, so the opt-out is exactly
# `cargo build -p tokenpress-cli --no-default-features` -- nothing else has to
# be re-enabled by hand.
ruby = ["dep:tokenpress-ruby"]

[dependencies]
tokenpress-core.workspace = true
tokenpress-python.workspace = true
tokenpress-rust.workspace = true
tokenpress-js.workspace = true
tokenpress-ruby = { workspace = true, optional = true }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
# Config file parsing only: the writer (`display`) half stays out of the build.
toml = { version = "1", default-features = false, features = [
    "parse",
    "serde",
    "std",
] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
similar = "2"

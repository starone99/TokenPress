[package]
name = "tokenpress-go"
description = "TokenPress for Go: the Go-specific half of the tree-sitter backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["hf-tokenizer"]
# Forwarded to tokenpress-core; see its manifest. Both dependencies below take
# it, because the engine forwards the same feature to the same crate: leaving
# the engine's copy off would leave `tokenpress-core` built without it for the
# engine's own use, which cargo would then have to reconcile as two feature
# sets of one crate.
hf-tokenizer = [
    "tokenpress-core/hf-tokenizer",
    "tokenpress-treesitter/hf-tokenizer",
]

[dependencies]
# Path dependencies, not `workspace = true`, for the reason the sibling crates
# record: `default-features = false` is ignored on an inherited dependency, and
# the `hf-tokenizer` feature has to be switchable by any consumer that cannot
# build it. It reaches `tokenpress-core` twice — directly, and through the
# engine — so both are declared with core's default off and the feature
# forwarded above.
tokenpress-core = { path = "../tokenpress-core", default-features = false }
tokenpress-treesitter = { path = "../tokenpress-treesitter", default-features = false }
# Grammar crates are pre-1.0 and version-locked to a generated parser ABI, so
# the ruff/oxc/prism rule applies unchanged: pin the exact version and confine
# **all** grammar API access to one module — `src/config.rs` here, the way
# `tokenpress-python` confines ruff to `src/parser.rs`. The pin is the same
# `=0.25.0` the engine tests against, and `src/config.rs` ships the
# `abi_version()` test every grammar pin owes.
#
# Build prerequisite: `cc` compiles the grammar's generated `parser.c` (C11).
# No C++, no bindgen/libclang.
#
# There is deliberately no direct `tree-sitter` dependency: the runtime is the
# engine's, and `tree_sitter_go::LANGUAGE` converts into the engine's
# re-exported `Language` type without naming the runtime crate here.
tree-sitter-go = "=0.25.0"

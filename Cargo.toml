[workspace]
resolver = "2"
members = [
    "crates/tokenpress-core",
    "crates/tokenpress-python",
    "crates/tokenpress-js",
    "crates/tokenpress-ruby",
    "crates/tokenpress-rust",
    "crates/tokenpress-treesitter",
    "crates/tokenpress-go",
    "crates/tokenpress-java",
    "crates/tokenpress-cli",
    "crates/tokenpress-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/starone99/TokenPress"

[workspace.dependencies]
tokenpress-core = { path = "crates/tokenpress-core" }
tokenpress-python = { path = "crates/tokenpress-python" }
tokenpress-rust = { path = "crates/tokenpress-rust" }
tokenpress-js = { path = "crates/tokenpress-js" }
tokenpress-ruby = { path = "crates/tokenpress-ruby" }
tokenpress-treesitter = { path = "crates/tokenpress-treesitter" }
tokenpress-go = { path = "crates/tokenpress-go" }
thiserror = "2"
tiktoken-rs = "0.12"
wasm-bindgen = "0.2"
serde = "1"
serde_json = "1"

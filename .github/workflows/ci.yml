name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use
      - uses: Swatinem/rust-cache@v2
      # ruby-prism-sys needs libclang (bindgen) + a C compiler
      - uses: ./.github/actions/libclang
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # ruby-prism-sys needs libclang (bindgen) + a C compiler
      - uses: ./.github/actions/libclang
      # `tokenpress-java`'s external-verification tests spawn the real `javac`
      # (`ruby` and `gofmt` come with the runner images; a JDK is installed
      # explicitly rather than inherited, so the version the parse gate was
      # measured against is the version CI runs).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # The opt-out configuration: `tokenpress-cli` without any of its four
  # default-on native backends. Deliberately no `.github/actions/libclang` step
  # -- the whole point of the features is that this build needs no C toolchain
  # at all, and the first step below proves every prerequisite is gone:
  # `tokenpress-ruby` (with `ruby-prism-sys` + bindgen), `tokenpress-go`,
  # `tokenpress-java` and `tokenpress-csharp` (with `tokenpress-treesitter`,
  # their grammars and the `cc` that compiles them) are not in the graph. Only
  # this fully-off configuration is built and tested -- the single-feature
  # builds are asserted on the dependency graph alone, which is what the
  # features are about; building every combination would buy nothing for the
  # CI minutes.
  no-native-backends:
    name: Build without the native backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: No native backend is in the dependency graph
        run: |
          set -euo pipefail
          tree=$(cargo tree -p tokenpress-cli --no-default-features)
          if printf '%s\n' "$tree" | grep -E 'tokenpress-ruby|ruby-prism|bindgen'; then
            echo '::error::the ruby backend is still reachable without the feature'
            exit 1
          fi
          # `cc v` with its separator, because `cargo tree` indents: a bare
          # `^cc ` would only ever match the root of the tree.
          if printf '%s\n' "$tree" | grep -E 'tokenpress-go|tokenpress-java|tokenpress-csharp|tokenpress-treesitter|tree-sitter|(^|[[:space:]])cc v'; then
            echo '::error::a tree-sitter backend is still reachable without the feature'
            exit 1
          fi
          # ... while the rest of the build is untouched. `--no-default-features`
          # now drops more than it used to, so this names what has to survive:
          # the three unconditional backends and the tokenizer stack.
          # `grep -q <<<` and not `printf | grep -q`: `-q` exits at the first
          # match, and under `set -o pipefail` a `printf` that has not finished
          # writing takes SIGPIPE and fails the whole pipeline — turning a
          # found dependency into "dropped". It is a race, so it reports a
          # different `$kept` on different runs, or passes. The `grep -E`
          # checks above are safe as pipelines because a non-`-q` grep drains
          # its input; only the `-q` form short-circuits.
          for kept in tokenpress-python tokenpress-rust tokenpress-js tokenizers; do
            grep -q "$kept" <<<"$tree" \
              || { echo "::error::--no-default-features dropped $kept"; exit 1; }
          done
      # Each single-feature build must be exactly its own slice of the graph.
      # `go`, `java` and `csharp` share `tokenpress-treesitter`, so it is not
      # enough that each re-adds tree-sitter: each must re-add *its own*
      # grammar and leave the others' out, which is what makes them
      # independent features rather than one "tree-sitter" switch.
      - name: Each single-feature build is exactly its own slice
        run: |
          set -euo pipefail
          go_only=$(cargo tree -p tokenpress-cli --no-default-features --features go)
          grep -q tree-sitter-go <<<"$go_only" \
            || { echo '::error::--features go did not re-add tree-sitter-go'; exit 1; }
          if printf '%s\n' "$go_only" | grep -E 'ruby-prism|tokenpress-java|tree-sitter-java|tokenpress-csharp|tree-sitter-c-sharp'; then
            echo '::error::--features go pulled another backend back in'
            exit 1
          fi
          java_only=$(cargo tree -p tokenpress-cli --no-default-features --features java)
          grep -q tree-sitter-java <<<"$java_only" \
            || { echo '::error::--features java did not re-add tree-sitter-java'; exit 1; }
          if printf '%s\n' "$java_only" | grep -E 'ruby-prism|tokenpress-go|tree-sitter-go|tokenpress-csharp|tree-sitter-c-sharp'; then
            echo '::error::--features java pulled another backend back in'
            exit 1
          fi
          csharp_only=$(cargo tree -p tokenpress-cli --no-default-features --features csharp)
          grep -q tree-sitter-c-sharp <<<"$csharp_only" \
            || { echo '::error::--features csharp did not re-add tree-sitter-c-sharp'; exit 1; }
          if printf '%s\n' "$csharp_only" | grep -E 'ruby-prism|tokenpress-go|tree-sitter-go|tokenpress-java|tree-sitter-java'; then
            echo '::error::--features csharp pulled another backend back in'
            exit 1
          fi
          ruby_only=$(cargo tree -p tokenpress-cli --no-default-features --features ruby)
          grep -q ruby-prism <<<"$ruby_only" \
            || { echo '::error::--features ruby did not re-add ruby-prism'; exit 1; }
          if printf '%s\n' "$ruby_only" | grep -E 'tokenpress-go|tokenpress-java|tokenpress-csharp|tokenpress-treesitter|tree-sitter'; then
            echo '::error::--features ruby pulled a tree-sitter backend back in'
            exit 1
          fi
      - name: Build
        run: cargo build -p tokenpress-cli --no-default-features
      - name: Test
        run: cargo test -p tokenpress-cli --no-default-features
      - name: Create fixture
        run: printf 'x=1' > no-backends-fixture.py
      # Both consumer integration surfaces build the CLI on the consumer's
      # machine, so both need their own way through: env vars for the
      # pre-commit hook, inputs for the action. One per backend, so a consumer
      # with a C compiler but no libclang can keep Go, Java and C#.
      - name: The pre-commit hook honors every TOKENPRESS_NO_* variable
        env:
          TOKENPRESS_NO_RUBY: '1'
          TOKENPRESS_NO_GO: '1'
          TOKENPRESS_NO_JAVA: '1'
          TOKENPRESS_NO_CSHARP: '1'
        run: sh scripts/pre-commit-hook.sh check no-backends-fixture.py
      - name: "The action honors ruby/go/java/csharp: false"
        uses: ./
        with:
          ruby: 'false'
          go: 'false'
          java: 'false'
          csharp: 'false'
          paths: no-backends-fixture.py

  # Exercises `action.yml` end to end through `uses: ./`, which is the only way
  # to test a composite action: its steps only exist inside a real runner.
  # It lives in this workflow because the action has to be gated on exactly what
  # everything else is gated on -- every push to master/main and every PR.
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action builds `tokenpress-cli`, which now pulls in
      # `tokenpress-ruby` -> `ruby-prism-sys` (vendored C + bindgen) and
      # `tokenpress-go`/`tokenpress-java`/`tokenpress-csharp` -> the
      # tree-sitter runtime and their grammars (C via `cc`), so the
      # *consumer's* runner needs libclang and a C compiler. This step is what
      # a real consumer would have to provide for itself: a composite action
      # cannot install toolchain prerequisites into the job that uses it, so
      # the repository's own action is used here to mirror that requirement
      # honestly instead of hiding it.
      - uses: ./.github/actions/libclang
      # No rust-cache here on purpose: the action brings its own actions/cache
      # step, and that step is part of what this job is testing.
      - name: Create fixtures
        run: |
          mkdir -p action-fixtures/pass action-fixtures/fail
          # `printf`, not a heredoc: normalized output carries no trailing
          # newline, so a heredoc could not write an already-normalized file.
          # The pass fixture keeps its comment (comments are kept by default),
          # and carries two unsupported files to prove the directory walk skips
          # them instead of failing with exit 2.
          printf '# keep me\ndef f(a,b):\n return a+b' > action-fixtures/pass/ok.py
          printf 'fn main(){println!("hi");}' > action-fixtures/pass/ok.rs
          printf 'notes\n' > action-fixtures/pass/notes.md
          printf '{"a": 1}\n' > action-fixtures/pass/data.json
          printf 'def  f( a ,  b ):\n    return   a  +  b\n' > action-fixtures/fail/bad.py
          # Ruby. Unlike the other backends, normalized Ruby *does* end in a
          # newline -- newlines are statement terminators and are never
          # removed -- and every comment survives at the default settings, so
          # `# keep me` stays put. `Gemfile` is here because it is the one
          # supported path with no extension: naming it explicitly below is
          # what exercises the action's basename filter.
          printf '# keep me\ndef f(a, b)\na + b\nend\n' > action-fixtures/pass/ok.rb
          printf 'source "https://rubygems.org"\n' > action-fixtures/pass/Gemfile
          printf 'def  f(a,  b)\n    a  +  b\nend\n' > action-fixtures/fail/bad.rb
          # Go. Normalized Go ends in a newline for the same reason Ruby does
          # -- the emitter never joins or introduces a line -- and every
          # comment survives at the default settings. `.go` needs its own
          # pattern in the action's glob filter, which naming it explicitly
          # below is what exercises.
          printf 'package main\n// keep me\nfunc f(a int) int {\nreturn a\n}\n' > action-fixtures/pass/ok.go
          printf 'package  main\n\nfunc  f( a int )  int  {\n\treturn  a\n}\n' > action-fixtures/fail/bad.go
          # Java. Same shape as Go: the emitter never joins or introduces a
          # line, so normalized Java ends in a newline, and every comment --
          # Javadoc included -- survives at the default settings. `.java` needs
          # its own pattern in the action's glob filter, which naming it
          # explicitly below is what exercises. `pom.xml` is here to prove the
          # directory walk skips a Java project's build descriptor.
          printf '/** Keep me. */\npublic class Ok {\nint f(int a) {\nreturn a;\n}\n}\n' > action-fixtures/pass/Ok.java
          printf '<project>  </project>\n' > action-fixtures/pass/pom.xml
          printf 'public  class  Bad  {\n\n    int  f( int a )  {\n        return  a;\n    }\n}\n' > action-fixtures/fail/Bad.java
          # C#. Same shape again, and every comment -- XML documentation
          # included -- survives at the default settings. `.cs` needs its own
          # pattern in the action's glob filter, which naming it explicitly
          # below is what exercises. `App.csproj` is here to prove the
          # directory walk skips a C# project's build descriptor.
          printf '/// <summary>Keep me.</summary>\npublic class Ok\n{\nint F(int a)\n{\nreturn a;\n}\n}\n' > action-fixtures/pass/Ok.cs
          printf '<Project>  </Project>\n' > action-fixtures/pass/App.csproj
          printf 'public  class  Bad\n{\n\n    int  F( int a )\n    {\n        return  a;\n    }\n}\n' > action-fixtures/fail/Bad.cs

      # Every step below that is expected to succeed asserts by failing the job.
      - name: Normalized tree passes
        uses: ./
        with:
          paths: action-fixtures/pass

      - name: Explicitly named unsupported files are filtered out
        uses: ./
        with:
          paths: action-fixtures/pass/ok.py action-fixtures/pass/notes.md

      # Named explicitly, not via the directory walk: this is the path the
      # action's own filter has to let through by basename.
      - name: Explicitly named Ruby files pass
        uses: ./
        with:
          paths: action-fixtures/pass/ok.rb action-fixtures/pass/Gemfile

      - name: Explicitly named Go files pass
        uses: ./
        with:
          paths: action-fixtures/pass/ok.go

      - name: Explicitly named Java files pass
        uses: ./
        with:
          paths: action-fixtures/pass/Ok.java

      - name: Explicitly named C# files pass
        uses: ./
        with:
          paths: action-fixtures/pass/Ok.cs

      - name: Unformatted Go fails
        id: go-fail
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/fail/bad.go

      - name: Unformatted Java fails
        id: java-fail
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/fail/Bad.java

      - name: Unformatted C# fails
        id: csharp-fail
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/fail/Bad.cs

      - name: Unformatted Ruby fails
        id: ruby-fail
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/fail/bad.rb

      - name: Unformatted tree fails
        id: check-fail
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/fail

      # `--py-strip-comments` would remove the comment the pass fixture keeps,
      # so the only way this step can fail is if extra-args reached the CLI.
      - name: extra-args are passed through
        id: extra-args
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/pass/ok.py
          extra-args: --py-strip-comments

      - name: format rewrites the unformatted tree and still fails
        id: format
        continue-on-error: true
        uses: ./
        with:
          mode: format
          paths: action-fixtures/fail

      - name: The rewritten tree now passes
        uses: ./
        with:
          paths: action-fixtures/fail

      - name: Assert the failing cases failed
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ '${{ steps.check-fail.outcome }}' = failure ] \
            || fail 'check must fail on an unformatted tree'
          [ '${{ steps.check-fail.outputs.changed }}' = true ] \
            || fail 'check must report changed=true on an unformatted tree'
          [ '${{ steps.ruby-fail.outcome }}' = failure ] \
            || fail 'check must fail on an unformatted Ruby file'
          [ '${{ steps.ruby-fail.outputs.changed }}' = true ] \
            || fail 'check must report changed=true on an unformatted Ruby file'
          [ '${{ steps.go-fail.outcome }}' = failure ] \
            || fail 'check must fail on an unformatted Go file'
          [ '${{ steps.go-fail.outputs.changed }}' = true ] \
            || fail 'check must report changed=true on an unformatted Go file'
          [ '${{ steps.java-fail.outcome }}' = failure ] \
            || fail 'check must fail on an unformatted Java file'
          [ '${{ steps.java-fail.outputs.changed }}' = true ] \
            || fail 'check must report changed=true on an unformatted Java file'
          [ '${{ steps.csharp-fail.outcome }}' = failure ] \
            || fail 'check must fail on an unformatted C# file'
          [ '${{ steps.csharp-fail.outputs.changed }}' = true ] \
            || fail 'check must report changed=true on an unformatted C# file'
          [ '${{ steps.extra-args.outcome }}' = failure ] \
            || fail 'extra-args did not reach the CLI'
          [ '${{ steps.format.outcome }}' = failure ] \
            || fail 'format must fail when it rewrote files'
          [ '${{ steps.format.outputs.changed }}' = true ] \
            || fail 'format must report changed=true when it rewrote files'

  coverage:
    name: Coverage gate (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # ruby-prism-sys needs libclang (bindgen) + a C compiler
      - uses: ./.github/actions/libclang
      # The gate runs the whole suite under instrumentation, so it needs every
      # external checker the suite spawns -- `javac` included.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage (fails under 100% line coverage)
        run: sh scripts/coverage.sh

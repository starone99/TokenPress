name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use
      - uses: Swatinem/rust-cache@v2
      # ruby-prism-sys needs libclang (bindgen) + a C compiler
      - uses: ./.github/actions/libclang
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # ruby-prism-sys needs libclang (bindgen) + a C compiler
      - uses: ./.github/actions/libclang
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # The opt-out configuration: `tokenpress-cli` without its default-on `ruby`
  # feature. Deliberately no `.github/actions/libclang` step -- the whole point
  # of the feature is that this build needs neither libclang nor a C compiler,
  # and the first step below proves the prerequisite is gone by showing that
  # `tokenpress-ruby` (and with it `ruby-prism-sys`) is not in the graph at all.
  no-ruby:
    name: Build without the ruby feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: The Ruby backend is out of the dependency graph
        run: |
          set -euo pipefail
          tree=$(cargo tree -p tokenpress-cli --no-default-features)
          if printf '%s\n' "$tree" | grep -E 'tokenpress-ruby|ruby-prism|bindgen'; then
            echo '::error::the ruby backend is still reachable without the feature'
            exit 1
          fi
          # ... while the rest of the default build is untouched: `ruby` is the
          # CLI's only feature, so `--no-default-features` drops nothing else.
          printf '%s\n' "$tree" | grep -q tokenizers \
            || { echo '::error::--no-default-features dropped the HF tokenizer'; exit 1; }
      - name: Build
        run: cargo build -p tokenpress-cli --no-default-features
      - name: Test
        run: cargo test -p tokenpress-cli --no-default-features
      - name: Create fixture
        run: printf 'x=1' > no-ruby-fixture.py
      # Both consumer integration surfaces build the CLI on the consumer's
      # machine, so both need their own way through: an env var for the
      # pre-commit hook, an input for the action.
      - name: The pre-commit hook honors TOKENPRESS_NO_RUBY
        env:
          TOKENPRESS_NO_RUBY: '1'
        run: sh scripts/pre-commit-hook.sh check no-ruby-fixture.py
      - name: "The action honors ruby: false"
        uses: ./
        with:
          ruby: 'false'
          paths: no-ruby-fixture.py

  # Exercises `action.yml` end to end through `uses: ./`, which is the only way
  # to test a composite action: its steps only exist inside a real runner.
  # It lives in this workflow because the action has to be gated on exactly what
  # everything else is gated on -- every push to master/main and every PR.
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action builds `tokenpress-cli`, which now pulls in
      # `tokenpress-ruby` -> `ruby-prism-sys` (vendored C + bindgen), so the
      # *consumer's* runner needs libclang and a C compiler. This step is what
      # a real consumer would have to provide for itself: a composite action
      # cannot install toolchain prerequisites into the job that uses it, so
      # the repository's own action is used here to mirror that requirement
      # honestly instead of hiding it.
      - uses: ./.github/actions/libclang
      # No rust-cache here on purpose: the action brings its own actions/cache
      # step, and that step is part of what this job is testing.
      - name: Create fixtures
        run: |
          mkdir -p action-fixtures/pass action-fixtures/fail
          # `printf`, not a heredoc: normalized output carries no trailing
          # newline, so a heredoc could not write an already-normalized file.
          # The pass fixture keeps its comment (comments are kept by default),
          # and carries two unsupported files to prove the directory walk skips
          # them instead of failing with exit 2.
          printf '# keep me\ndef f(a,b):\n return a+b' > action-fixtures/pass/ok.py
          printf 'fn main(){println!("hi");}' > action-fixtures/pass/ok.rs
          printf 'notes\n' > action-fixtures/pass/notes.md
          printf '{"a": 1}\n' > action-fixtures/pass/data.json
          printf 'def  f( a ,  b ):\n    return   a  +  b\n' > action-fixtures/fail/bad.py
          # Ruby. Unlike the other backends, normalized Ruby *does* end in a
          # newline -- newlines are statement terminators and are never
          # removed -- and every comment survives at the default settings, so
          # `# keep me` stays put. `Gemfile` is here because it is the one
          # supported path with no extension: naming it explicitly below is
          # what exercises the action's basename filter.
          printf '# keep me\ndef f(a, b)\na + b\nend\n' > action-fixtures/pass/ok.rb
          printf 'source "https://rubygems.org"\n' > action-fixtures/pass/Gemfile
          printf 'def  f(a,  b)\n    a  +  b\nend\n' > action-fixtures/fail/bad.rb

      # Every step below that is expected to succeed asserts by failing the job.
      - name: Normalized tree passes
        uses: ./
        with:
          paths: action-fixtures/pass

      - name: Explicitly named unsupported files are filtered out
        uses: ./
        with:
          paths: action-fixtures/pass/ok.py action-fixtures/pass/notes.md

      # Named explicitly, not via the directory walk: this is the path the
      # action's own filter has to let through by basename.
      - name: Explicitly named Ruby files pass
        uses: ./
        with:
          paths: action-fixtures/pass/ok.rb action-fixtures/pass/Gemfile

      - name: Unformatted Ruby fails
        id: ruby-fail
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/fail/bad.rb

      - name: Unformatted tree fails
        id: check-fail
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/fail

      # `--py-strip-comments` would remove the comment the pass fixture keeps,
      # so the only way this step can fail is if extra-args reached the CLI.
      - name: extra-args are passed through
        id: extra-args
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures/pass/ok.py
          extra-args: --py-strip-comments

      - name: format rewrites the unformatted tree and still fails
        id: format
        continue-on-error: true
        uses: ./
        with:
          mode: format
          paths: action-fixtures/fail

      - name: The rewritten tree now passes
        uses: ./
        with:
          paths: action-fixtures/fail

      - name: Assert the failing cases failed
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ '${{ steps.check-fail.outcome }}' = failure ] \
            || fail 'check must fail on an unformatted tree'
          [ '${{ steps.check-fail.outputs.changed }}' = true ] \
            || fail 'check must report changed=true on an unformatted tree'
          [ '${{ steps.ruby-fail.outcome }}' = failure ] \
            || fail 'check must fail on an unformatted Ruby file'
          [ '${{ steps.ruby-fail.outputs.changed }}' = true ] \
            || fail 'check must report changed=true on an unformatted Ruby file'
          [ '${{ steps.extra-args.outcome }}' = failure ] \
            || fail 'extra-args did not reach the CLI'
          [ '${{ steps.format.outcome }}' = failure ] \
            || fail 'format must fail when it rewrote files'
          [ '${{ steps.format.outputs.changed }}' = true ] \
            || fail 'format must report changed=true when it rewrote files'

  coverage:
    name: Coverage gate (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # ruby-prism-sys needs libclang (bindgen) + a C compiler
      - uses: ./.github/actions/libclang
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage (fails under 100% line coverage)
        run: sh scripts/coverage.sh

# ruby-prism-sys needs libclang (bindgen) + a C compiler.
#
# tokenpress-ruby depends on ruby-prism, whose -sys crate compiles the vendored
# prism C sources with `cc` and generates its bindings with bindgen. Every
# runner that builds the workspace therefore needs a C compiler (preinstalled
# on both hosted images) and libclang. Ruby itself is NOT needed at build time.
#
# The GitHub-hosted ubuntu-latest and windows-latest images do ship LLVM, but
# this step exists so that is not relied on silently: it checks, and installs
# only if the check fails. Internal to this repository -- the consumer-facing
# composite action is the root action.yml.
name: Ensure libclang
description: Makes libclang available to bindgen on Linux, macOS and Windows runners.

runs:
  using: composite
  steps:
    - name: Ensure libclang (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ls /usr/lib/llvm-*/lib/libclang.so* /usr/lib/*/libclang*.so* \
             >/dev/null 2>&1; then
          echo "libclang is already present"
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
        fi

    - name: Ensure libclang (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Xcode ships libclang, and every hosted macOS image has it, so this
        # locates it rather than installing -- and fails loudly rather than
        # letting bindgen produce a confusing error later.
        #
        # There are two layouts and they do not agree, which is what this got
        # wrong before: with the Command Line Tools alone, `xcode-select -p` is
        # `/Library/Developer/CommandLineTools` and libclang sits directly
        # under its `usr/lib`; with a full Xcode -- what the hosted images have
        # -- `xcode-select -p` is inside the app bundle and libclang is one
        # more level in, under `Toolchains/XcodeDefault.xctoolchain/usr/lib`.
        # Deriving the directory from `xcrun -f clang` covers both without
        # hardcoding either: the compiler it finds is in the toolchain's
        # `usr/bin`, so libclang is its sibling `usr/lib`. The `xcode-select`
        # path stays as a fallback for a toolchain that resolves oddly.
        lib=''
        if clang_bin="$(xcrun -f clang 2>/dev/null)"; then
          candidate="$(dirname "$(dirname "$clang_bin")")/lib/libclang.dylib"
          [ -f "$candidate" ] && lib="$candidate"
        fi
        if [ -z "$lib" ]; then
          candidate="$(xcode-select -p)/usr/lib/libclang.dylib"
          [ -f "$candidate" ] && lib="$candidate"
        fi

        if [ -z "$lib" ]; then
          echo "::error::libclang.dylib not found (xcode-select -p = $(xcode-select -p))"
          exit 1
        fi
        echo "libclang is already present at $lib"
        # Exported for every later step in the job, so bindgen resolves the
        # same file this step verified instead of searching on its own -- the
        # Windows branch below does the same, for the same reason.
        echo "LIBCLANG_PATH=$(dirname "$lib")" >>"$GITHUB_ENV"

    - name: Ensure libclang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # bindgen locates the DLL through LIBCLANG_PATH, which is exported for
        # every later step in the job.
        $llvm = 'C:\Program Files\LLVM\bin'
        if (-not (Test-Path "$llvm\libclang.dll")) {
          choco install llvm --no-progress --yes
        }
        if (-not (Test-Path "$llvm\libclang.dll")) {
          Write-Error "libclang.dll not found at $llvm"
          exit 1
        }
        "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append

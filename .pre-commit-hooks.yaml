# Hook definitions for the pre-commit framework (https://pre-commit.com).
#
# Consumers add TokenPress to their own `.pre-commit-config.yaml`:
#
#     repos:
#       - repo: https://github.com/starone99/TokenPress
#         rev: v0.1.0
#         hooks:
#           - id: tokenpress-check
#
# `language: script` (not `language: rust`): pre-commit's rust language runs
# `cargo install --bins --path .` at the repository root, which cannot work
# here because the root manifest is a virtual workspace manifest. The entry
# script below obtains the CLI from pre-commit's clone of this repository
# instead.
#
# **Pin `rev:` to a release tag.** On a tag the entry script downloads that
# release's binary, verifies it against the release's SHA256SUMS and runs it,
# which takes seconds and needs no toolchain at all. On a branch or a bare
# commit there is no release binary to correspond to the pin, so the script
# compiles the CLI from the clone -- correct, but it wants `cargo`, a C
# compiler and libclang, and the first run is minutes rather than seconds.
# `TOKENPRESS_NO_PREBUILT=1` forces the source build on a tag too.
#
# Only the paths the CLI accepts are matched: any other path makes the CLI
# exit 2 with "unsupported language for path". Ruby is the one backend that
# also claims extensionless names, so the regex is an alternation of an
# extension branch and an exact-basename branch for `Gemfile`/`Rakefile`
# (`(^|/)` because pre-commit matches the repository-relative path, not the
# file name). Go, Java and C# need nothing of the sort: `.go`, `.java` and
# `.cs` are their whole path sets, and the build descriptors that sit beside
# them -- `go.mod`/`go.sum`, `pom.xml`/`build.gradle`, `.csproj`/`.sln` -- are
# not source of any of the three (the extension branch does not match them
# either).
#
# `files` and `types_or` are ANDed by pre-commit: a path has to match the
# regex *and* carry one of the tags. The `files` regex is the authority;
# `types_or` is only a coarse pre-filter, so a tag an older identify release
# does not emit means a skipped file -- a conservative miss, never a wrong
# rewrite. Known cases:
#   * `.mts`/`.cts` are not tagged `ts` by every identify release.
#   * `jsx` is listed because identify tags `.jsx` as `jsx`, not `javascript`;
#     `.tsx` is tagged `ts` + `tsx`, so `ts` already covers it and `tsx` is
#     listed alongside for the same reason.
#   * `ruby` covers every Ruby path this hook matches: identify 2.6.19 tags
#     `.rb`, `.rake`, `.gemspec`, `.ru`, `Gemfile` and `Rakefile` all as
#     `ruby` (verified against that release), so no second tag is needed.
#   * `go` is the tag for `.go` -- not `golang`, which identify does not emit
#     at all (verified against identify 2.6.19, and unchanged as far back as
#     2.5.0). `go.mod` and `go.sum` carry `go-mod`/`go-sum` instead, so they
#     are filtered out by the tag as well as by the regex.
#   * `java` is the tag for `.java`, `module-info.java` and
#     `package-info.java` included (verified against identify 2.6.19). The
#     files a Java build puts next to them are tagged by what they actually
#     are -- `pom.xml` is `pom`/`xml`, `build.gradle` is `groovy` -- so they
#     are filtered out by the tag as well as by the regex.
#   * `c#` is the tag identify emits for `.cs` (verified against identify
#     2.6.19) -- the tag keeps the language's real name even though the CLI's
#     language key, cargo feature and config table are all spelled `csharp`.
#     It is quoted in the list below because a bare `c#` in YAML would start a
#     comment. A C# project's descriptors are tagged by what they are --
#     `.csproj` and `.sln` are not `c#` -- so they are filtered out by the tag
#     as well as by the regex.
#
# `TOKENPRESS_NO_RUBY=1` / `TOKENPRESS_NO_GO=1` / `TOKENPRESS_NO_JAVA=1` /
# `TOKENPRESS_NO_CSHARP=1` in the environment make the entry script build the
# CLI without its default-on `ruby` / `go` / `java` / `csharp` cargo feature
# (dropping libclang with the first, and the C compiler once none of the other
# three is left on). The filters below are static, so a repository that has
# files of a dropped backend *and* sets the variable must exclude them itself
# with `exclude:` in its own config.

- id: tokenpress-check
  name: tokenpress check
  description: >-
    Fail if any Python, Rust, JavaScript/TypeScript, Ruby, Go, Java or C#
    file is not in TokenPress-normalized form. Writes nothing.
  entry: scripts/pre-commit-hook.sh check
  language: script
  files: (\.(py|rs|js|mjs|cjs|jsx|ts|mts|cts|tsx|rb|rake|gemspec|ru|go|java|cs)$|(^|/)(Gemfile|Rakefile)$)
  types_or: [python, rust, javascript, jsx, ts, tsx, ruby, go, java, "c#"]
  # One process at a time: the first invocation populates the CLI -- a
  # download into the clone's `target/prebuilt/`, or a `cargo build` -- and
  # parallel invocations would race to write the same path or contend for the
  # same cargo lock. Later invocations reuse what the first one left.
  require_serial: true
  minimum_pre_commit_version: '2.9.0'

- id: tokenpress-format
  name: tokenpress format
  description: >-
    Rewrite Python, Rust, JavaScript/TypeScript, Ruby, Go, Java and C# files
    in place with token-minimized formatting. Modifies files, so pre-commit
    reports the run as failed whenever it had something to rewrite.
  entry: scripts/pre-commit-hook.sh format
  language: script
  files: (\.(py|rs|js|mjs|cjs|jsx|ts|mts|cts|tsx|rb|rake|gemspec|ru|go|java|cs)$|(^|/)(Gemfile|Rakefile)$)
  types_or: [python, rust, javascript, jsx, ts, tsx, ruby, go, java, "c#"]
  require_serial: true
  minimum_pre_commit_version: '2.9.0'
